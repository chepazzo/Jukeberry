---
- name: Install system dependencies
  become: true
  ansible.builtin.apt:
    name: ["python3", "python3-pip", "git", "{{ jukeberry_player }}"]
    state: present
    update_cache: true

- name: Create the Jukeberry group
  become: true
  ansible.builtin.group:
    name: "{{ jukeberry_group }}"
    state: present

- name: Create the Jukeberry user
  become: true
  ansible.builtin.user:
    name: "{{ jukeberry_user }}"
    group: "{{ jukeberry_group }}"
    shell: /bin/bash
    create_home: true

- name: Create application directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ jukeberry_user }}"
    group: "{{ jukeberry_group }}"
    mode: '0755'
  loop:
    - "{{ jukeberry_install_dir }}"
    - "{{ music_library_path }}"

- name: Deploy Jukeberry from git
  become: true
  ansible.builtin.git:
    repo: "{{ jukeberry_repo_src }}"
    dest: "{{ jukeberry_install_dir }}"
    version: "{{ jukeberry_repo_version }}"
    force: true
  when: not jukeberry_local_install

- name: Deploy Jukeberry from local source
  become: true
  ansible.builtin.copy:
    src: "{{ jukeberry_local_path }}/"
    dest: "{{ jukeberry_install_dir }}/"
  when: jukeberry_local_install

- name: Install Python dependencies
  become: true
  ansible.builtin.pip:
    requirements: "{{ jukeberry_install_dir }}/requirements.txt"
    executable: pip3

- name: Create Jukeberry configuration file
  become: true
  ansible.builtin.template:
    src: jukeberry.conf.j2
    dest: "{{ jukeberry_config_file }}"
    owner: root
    group: root
    mode: '0644'

- name: Create systemd service file
  become: true
  ansible.builtin.template:
    src: jukeberry.service.j2
    dest: /etc/systemd/system/jukeberry.service
    owner: root
    group: root
    mode: '0644'
  notify: restart jukeberry

- name: Ensure Jukeberry service is started and enabled
  become: true
  ansible.builtin.systemd:
    name: jukeberry
    state: started
    enabled: true
    daemon_reload: true

- name: "Enable kiosk on startup"
  lineinfile:
    path: '/home/{{ user }}/.config/lxsession/LXDE-pi/autostart'
    line: '@chromium-browser --kiosk http://localhost:5000/'
    create: 'yes'
    mode: '0600'
    owner: '{{ user }}'
    group: '{{ user }}'

